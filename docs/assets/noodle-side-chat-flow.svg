<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" role="img" aria-labelledby="title description"><title id="title">Think beside the main task</title><desc id="description">The main session supplies bounded context to a separate side conversation. Repo tools, Note main and Redirect start off. Enabled notes and separately reviewed redirects can return to main. Closing the panel does not stop work. Shared memory has separate controls. Conceptual diagram, not a live UI.</desc><defs><marker id="mint" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#7dd3c0"/></marker><marker id="gold" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#ffd27a"/></marker><marker id="pink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#ff7a93"/></marker></defs><rect x="1" y="1" width="958" height="454" rx="20" fill="#0d111b" stroke="#30394c"/><text x="36" y="49" font-family="Verdana,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#ff7a93">Ask beside the main task</text><text x="36" y="86" font-family="Verdana,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b8c2d8">A separate conversation, with bounded main-session context.</text><g data-card="main" data-box="36 132 280 130"><rect x="36" y="132" width="280" height="130" rx="16" fill="#171c2b" stroke="#7dd3c0" stroke-opacity=".7" stroke-width="1.5"/><text x="176" y="176" font-family="Verdana,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#7dd3c0">Main Pi</text><text x="176" y="214" font-family="Verdana,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#edf1fa">Your main task</text></g><g data-card="side" data-box="644 132 280 130"><rect x="644" y="132" width="280" height="130" rx="16" fill="#171c2b" stroke="#ff7a93" stroke-opacity=".7" stroke-width="1.5"/><text x="784" y="176" font-family="Verdana,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#ff7a93">Side chat</text><text x="784" y="214" font-family="Verdana,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#edf1fa">Ask. Think. Compare.</text></g><text x="480" y="175" font-family="Verdana,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#b8c2d8">Bounded context</text><path d="M322 195H638" fill="none" stroke="#7dd3c0" stroke-width="2.5"  marker-end="url(#mint)" /><path d="M784 268V300H176V268" fill="none" stroke="#ff7a93" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#pink)" /><g data-card="bridge" data-box="246 318 468 66"><rect x="246" y="318" width="468" height="66" rx="16" fill="#171c2b" stroke="#ffd27a" stroke-opacity=".7" stroke-width="1.5"/><text x="480" y="362" font-family="Verdana,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#ffd27a">Note main OFF · Redirect OFF</text></g><text x="480" y="415" font-family="Verdana,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#b8c2d8">Enable notes separately. Review every redirect. Repo tools start off.</text><text x="480" y="442" font-family="Verdana,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#b8c2d8">Close hides the panel; work can continue. Memory is independent.</text></svg>
