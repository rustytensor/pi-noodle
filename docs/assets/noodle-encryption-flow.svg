<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title description"><title id="title">What archive encryption protects</title><desc id="description">Optional encryption protects only the active archive database, search index and SQLite journals. Shared memory, original Pi transcripts and retained plaintext copies are outside. Selected retrieved text can reach a model; model access is a separate opt-in. Conceptual diagram, not a live UI.</desc><defs><marker id="mint" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#7dd3c0"/></marker><marker id="gold" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#ffd27a"/></marker><marker id="pink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#ff7a93"/></marker></defs><rect x="1" y="1" width="958" height="498" rx="20" fill="#0d111b" stroke="#30394c"/><text x="36" y="49" font-family="Verdana,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#ffd27a">Optional archive encryption</text><text x="36" y="89" font-family="Verdana,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b8c2d8">Protect the archive on disk—not everything Pi stores.</text><g data-card="inside" data-box="36 130 408 206"><rect x="36" y="130" width="408" height="206" rx="16" fill="#171c2b" stroke="#ffd27a" stroke-opacity=".7" stroke-width="1.5"/><text x="240" y="174" font-family="Verdana,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#ffd27a">Encrypted archive</text><text x="240" y="212" font-family="Verdana,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#edf1fa">Database + search index</text><text x="240" y="247" font-family="Verdana,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#edf1fa">SQLite journals</text></g><g data-card="outside" data-box="516 130 408 206"><rect x="516" y="130" width="408" height="206" rx="16" fill="#171c2b" stroke="#ff7a93" stroke-opacity=".7" stroke-width="1.5"/><text x="720" y="174" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#ff7a93">Outside this protection</text><text x="720" y="212" font-family="Verdana,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#edf1fa">Shared memory</text><text x="720" y="247" font-family="Verdana,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#edf1fa">Original Pi transcripts</text><text x="720" y="282" font-family="Verdana,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#edf1fa">Retained plaintext copies</text></g><path d="M240 340V373" fill="none" stroke="#ffd27a" stroke-width="2.5"  marker-end="url(#gold)" /><g data-card="read" data-box="36 380 888 70"><rect x="36" y="380" width="888" height="70" rx="16" fill="#171c2b" stroke="#7dd3c0" stroke-opacity=".7" stroke-width="1.5"/><text x="480" y="424" font-family="Verdana,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#7dd3c0">Unlock → read results → active model / provider</text></g><text x="480" y="480" font-family="Verdana,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#b8c2d8">OFF by default · model access is separate · not end-to-end encryption</text></svg>
