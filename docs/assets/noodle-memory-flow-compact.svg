<svg xmlns="http://www.w3.org/2000/svg" width="600" height="790" viewBox="0 0 600 790" role="img" aria-labelledby="title description"><title id="title">One memory, both conversations</title><desc id="description">Main Pi and the side chat save and recall from one local memory store. You review and edit curated notes. Memory starts on in trusted projects, is plaintext, and recalled facts can reach your active model. Conceptual diagram, not a live UI.</desc><defs><marker id="mint" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#7dd3c0"/></marker><marker id="gold" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#ffd27a"/></marker><marker id="pink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#ff7a93"/></marker></defs><rect x="1" y="1" width="598" height="788" rx="20" fill="#0d111b" stroke="#30394c"/><text x="30" y="48" font-family="Verdana,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#7dd3c0">One memory.</text><text x="30" y="88" font-family="Verdana,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#edf1fa">Both conversations.</text><g data-card="main" data-box="60 132 480 86"><rect x="60" y="132" width="480" height="86" rx="16" fill="#171c2b" stroke="#7dd3c0" stroke-opacity=".7" stroke-width="1.5"/><text x="300" y="176" font-family="Verdana,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#7dd3c0">Main Pi — your main task</text></g><path d="M300 222V258" fill="none" stroke="#7dd3c0" stroke-width="2.5"  marker-end="url(#mint)" marker-start="url(#mint)"/><g data-card="memory" data-box="60 264 480 126"><rect x="60" y="264" width="480" height="126" rx="16" fill="#171c2b" stroke="#ffd27a" stroke-opacity=".7" stroke-width="1.5"/><text x="300" y="308" font-family="Verdana,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#ffd27a">Shared local memory</text><text x="300" y="346" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#edf1fa">Saved notes + recent text</text></g><path d="M300 394V424" fill="none" stroke="#7dd3c0" stroke-width="2.5"  marker-end="url(#mint)" marker-start="url(#mint)"/><g data-card="side" data-box="60 430 480 86"><rect x="60" y="430" width="480" height="86" rx="16" fill="#171c2b" stroke="#7dd3c0" stroke-opacity=".7" stroke-width="1.5"/><text x="300" y="474" font-family="Verdana,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#7dd3c0">Side chat — separate thread</text></g><g data-card="editor" data-box="60 554 480 80"><rect x="60" y="554" width="480" height="80" rx="16" fill="#171c2b" stroke="#ff7a93" stroke-opacity=".7" stroke-width="1.5"/><text x="300" y="598" font-family="Verdana,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#ff7a93">You review and edit notes</text></g><text x="300" y="681" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#7dd3c0">On in trusted projects.</text><text x="300" y="721" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#b8c2d8">Local plaintext. Recalled facts</text><text x="300" y="757" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#b8c2d8">can reach your active model.</text></svg>
