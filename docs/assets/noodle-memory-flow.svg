<svg xmlns="http://www.w3.org/2000/svg" width="960" height="408" viewBox="0 0 960 408" role="img" aria-labelledby="title description"><title id="title">One memory, both conversations</title><desc id="description">Main Pi and the side chat save and recall from one local memory store. You review and edit curated notes. Memory starts on in trusted projects, is plaintext, and recalled facts can reach your active model. Conceptual diagram, not a live UI.</desc><defs><marker id="mint" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#7dd3c0"/></marker><marker id="gold" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#ffd27a"/></marker><marker id="pink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#ff7a93"/></marker></defs><rect x="1" y="1" width="958" height="406" rx="20" fill="#0d111b" stroke="#30394c"/><text x="36" y="49" font-family="Verdana,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#edf1fa">One memory, available in both conversations</text><text x="36" y="86" font-family="Verdana,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b8c2d8">Save useful facts once. Recall them when they help.</text><g data-card="main" data-box="36 136 224 104"><rect x="36" y="136" width="224" height="104" rx="16" fill="#171c2b" stroke="#7dd3c0" stroke-opacity=".7" stroke-width="1.5"/><text x="148" y="180" font-family="Verdana,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#7dd3c0">Main Pi</text><text x="148" y="218" font-family="Verdana,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#edf1fa">your main task</text></g><g data-card="memory" data-box="340 122 280 132"><rect x="340" y="122" width="280" height="132" rx="16" fill="#171c2b" stroke="#ffd27a" stroke-opacity=".7" stroke-width="1.5"/><text x="480" y="166" font-family="Verdana,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#ffd27a">Shared memory</text><text x="480" y="204" font-family="Verdana,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#edf1fa">notes + recent text</text></g><g data-card="side" data-box="700 136 224 104"><rect x="700" y="136" width="224" height="104" rx="16" fill="#171c2b" stroke="#7dd3c0" stroke-opacity=".7" stroke-width="1.5"/><text x="812" y="180" font-family="Verdana,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#7dd3c0">Side chat</text><text x="812" y="218" font-family="Verdana,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#edf1fa">separate thread</text></g><path d="M266 188H334" fill="none" stroke="#7dd3c0" stroke-width="2.5"  marker-end="url(#mint)" marker-start="url(#mint)"/><path d="M626 188H694" fill="none" stroke="#7dd3c0" stroke-width="2.5"  marker-end="url(#mint)" marker-start="url(#mint)"/><g data-card="editor" data-box="340 294 280 70"><rect x="340" y="294" width="280" height="70" rx="16" fill="#171c2b" stroke="#ff7a93" stroke-opacity=".7" stroke-width="1.5"/><text x="480" y="338" font-family="Verdana,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#ff7a93">Review and edit notes</text></g><path d="M480 288V260" fill="none" stroke="#ff7a93" stroke-width="2.5"  marker-end="url(#pink)" /><text x="480" y="390" font-family="Verdana,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#b8c2d8">On in trusted projects · plaintext · recall can reach your active model</text></svg>
