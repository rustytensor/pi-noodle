<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850" viewBox="0 0 600 850" role="img" aria-labelledby="title description"><title id="title">What archive encryption protects</title><desc id="description">Optional encryption protects only the active archive database, search index and SQLite journals. Shared memory, original Pi transcripts and retained plaintext copies are outside. Selected retrieved text can reach a model; model access is a separate opt-in. Conceptual diagram, not a live UI.</desc><defs><marker id="mint" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#7dd3c0"/></marker><marker id="gold" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#ffd27a"/></marker><marker id="pink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#ff7a93"/></marker></defs><rect x="1" y="1" width="598" height="848" rx="20" fill="#0d111b" stroke="#30394c"/><text x="30" y="49" font-family="Verdana,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#ffd27a">Optional archive encryption</text><text x="30" y="91" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#b8c2d8">Archive + encryption start off</text><g data-card="inside" data-box="30 124 540 180"><rect x="30" y="124" width="540" height="180" rx="16" fill="#171c2b" stroke="#ffd27a" stroke-opacity=".7" stroke-width="1.5"/><text x="300" y="168" font-family="Verdana,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#ffd27a">Inside the encrypted archive</text><text x="300" y="206" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#edf1fa">Database + search index</text><text x="300" y="241" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#edf1fa">SQLite journals</text></g><g data-card="outside" data-box="30 342 540 210"><rect x="30" y="342" width="540" height="210" rx="16" fill="#171c2b" stroke="#ff7a93" stroke-opacity=".7" stroke-width="1.5"/><text x="300" y="386" font-family="Verdana,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#ff7a93">Outside this protection</text><text x="300" y="424" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#edf1fa">Shared memory</text><text x="300" y="459" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#edf1fa">Original Pi transcripts</text><text x="300" y="494" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#edf1fa">Retained plaintext copies</text></g><g data-card="read" data-box="30 592 540 112"><rect x="30" y="592" width="540" height="112" rx="16" fill="#171c2b" stroke="#7dd3c0" stroke-opacity=".7" stroke-width="1.5"/><text x="300" y="636" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#7dd3c0">Unlock → read selected results</text><text x="300" y="674" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#edf1fa">Results can reach your model.</text></g><text x="300" y="751" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#b8c2d8">Capture, encryption and model</text><text x="300" y="787" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#b8c2d8">access are separate controls.</text><text x="300" y="823" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#ffd27a">Not end-to-end encryption.</text></svg>
