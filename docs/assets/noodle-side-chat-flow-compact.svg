<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-labelledby="title description"><title id="title">Think beside the main task</title><desc id="description">The main session supplies bounded context to a separate side conversation. Repo tools, Note main and Redirect start off. Enabled notes and separately reviewed redirects can return to main. Closing the panel does not stop work. Shared memory has separate controls. Conceptual diagram, not a live UI.</desc><defs><marker id="mint" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#7dd3c0"/></marker><marker id="gold" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#ffd27a"/></marker><marker id="pink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#ff7a93"/></marker></defs><rect x="1" y="1" width="598" height="798" rx="20" fill="#0d111b" stroke="#30394c"/><text x="30" y="50" font-family="Verdana,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#ff7a93">Think beside the main task</text><g data-card="main" data-box="60 106 480 104"><rect x="60" y="106" width="480" height="104" rx="16" fill="#171c2b" stroke="#7dd3c0" stroke-opacity=".7" stroke-width="1.5"/><text x="300" y="150" font-family="Verdana,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#7dd3c0">Main Pi</text><text x="300" y="188" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#edf1fa">Your main task</text></g><path d="M300 216V280" fill="none" stroke="#7dd3c0" stroke-width="2.5"  marker-end="url(#mint)" /><text x="327" y="254" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#b8c2d8">Bounded context</text><g data-card="side" data-box="60 288 480 110"><rect x="60" y="288" width="480" height="110" rx="16" fill="#171c2b" stroke="#ff7a93" stroke-opacity=".7" stroke-width="1.5"/><text x="300" y="332" font-family="Verdana,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#ff7a93">Side chat</text><text x="300" y="370" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#edf1fa">Questions + second opinions</text></g><path d="M60 344H32V159H56" fill="none" stroke="#ff7a93" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#pink)" /><g data-card="bridge" data-box="60 440 480 144"><rect x="60" y="440" width="480" height="144" rx="16" fill="#171c2b" stroke="#ffd27a" stroke-opacity=".7" stroke-width="1.5"/><text x="300" y="484" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#ffd27a">Back to main, if enabled</text><text x="300" y="522" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#edf1fa">Note main: off by default</text><text x="300" y="557" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#edf1fa">Redirect: review every send</text></g><g data-card="local" data-box="60 622 480 110"><rect x="60" y="622" width="480" height="110" rx="16" fill="#171c2b" stroke="#7dd3c0" stroke-opacity=".7" stroke-width="1.5"/><text x="300" y="666" font-family="Verdana,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#7dd3c0">Repo tools start off.</text><text x="300" y="704" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#edf1fa">Close is not stop.</text></g><text x="300" y="775" font-family="Verdana,Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#b8c2d8">Memory has separate controls.</text></svg>
